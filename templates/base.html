<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delhi Air Quality &amp; Health Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Delhi AQI Dashboard</a>
      <div class="navbar-nav">
        <a class="nav-link" href="/">Dashboard</a>
        <a class="nav-link" href="/advisory">Health Advisory</a>
        <a class="nav-link" href="/stations">Stations</a>
      </div>
    </div>
  </nav>
  <main class="container my-4">
    {% block content %}{% endblock %}
  </main>
  <footer class="container text-muted small mb-4">
    Data: Open-Meteo / CAMS, 1 Jun – 10 Nov 2026, Anand Vihar, RK Puram,
    Najafgarh. AQI computed with the CPCB formula (see README). Modelled
    data — not official CPCB station readings.
  </footer>
</body>
</html>
